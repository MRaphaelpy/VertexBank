name: vertexbank

x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 3s
  retries: 10

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASS: ${POSTGRES_PASSWORD:-postgres}
  SPRING_DOCKER_COMPOSE_ENABLED: "false"

services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: [auth-db-data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5433:5432"]
    volumes: [user-db-data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  account-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5439:5432"]
    volumes: [account-db-data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  auth-service:
    build: ./AuthService
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
    ports: ["8081:8081"]
    depends_on:
      auth-db: { condition: service_healthy }
    restart: unless-stopped

  user-service:
    build: ./UserService
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://user-db:5432/user_db
    ports: ["8082:8082"]
    depends_on:
      user-db: { condition: service_healthy }
    restart: unless-stopped

  account-service:
    build: ./AccountService
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://account-db:5432/account_db?sslmode=disable
      USER_SERVICE_URL: http://user-service:8082
    ports: ["8083:8083"]
    depends_on:
      account-db: { condition: service_healthy }
      user-service: { condition: service_started }
    restart: unless-stopped

  api-gateway:
    build: ./APIGateway
    environment:
      AUTH_URL: http://auth-service:8081
      USER_URL: http://user-service:8082
      ACCOUNT_URL: http://account-service:8083
    ports: ["8080:8080"]
    depends_on:
      - auth-service
      - user-service
      - account-service
    restart: unless-stopped

volumes:
  auth-db-data:
  user-db-data:
  account-db-data:
