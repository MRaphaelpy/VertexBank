name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_COVERAGE_CHANGED_LINES: 80
  MIN_COVERAGE_OVERALL: 80

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [AuthService, UserService, AccountService, APIGateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build, test and measure coverage
        run: ./mvnw -B verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/jacoco.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  coverage:
    name: Coverage
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: reports

      - name: Publish coverage comment
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/reports/**/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: ${{ env.MIN_COVERAGE_OVERALL }}
          min-coverage-changed-lines: ${{ env.MIN_COVERAGE_CHANGED_LINES }}
          title: '📊 Cobertura de Testes'
          update-comment: true
          comment-type: both
          show-all-modules: true
          pass-emoji: ':green_circle:'
          fail-emoji: ':red_circle:'

      - name: Enforce coverage on changed lines
        if: ${{ steps.jacoco.outputs.coverage-changed-lines != '' && fromJSON(steps.jacoco.outputs.coverage-changed-lines) < fromJSON(env.MIN_COVERAGE_CHANGED_LINES) }}
        run: |
          echo "::error::Cobertura das linhas alteradas (${{ steps.jacoco.outputs.coverage-changed-lines }}%) abaixo do mínimo de ${{ env.MIN_COVERAGE_CHANGED_LINES }}%"
          exit 1

  status:
    name: CI Status
    needs: [test, coverage]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build status message
        id: message
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$TEST_RESULT" = "success" ] && [ "$COVERAGE_RESULT" = "success" ]; then
            {
              echo "body<<EOF"
              echo "## ✅ CI verde, pronto para revisão"
              echo "Testes unitários, integração e cobertura das linhas alteradas passaram."
              echo ""
              echo "CI verde diz que nada quebrou, não que a solução é a certa. Aguarde a revisão antes de mergear."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF"
              echo "## ❌ CI falhou"
              echo "| Etapa | Resultado |"
              echo "|---|---|"
              echo "| Testes | $TEST_RESULT |"
              echo "| Cobertura | $COVERAGE_RESULT |"
              echo ""
              echo "Veja os detalhes na aba **Checks** deste PR."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-status
          message: ${{ steps.message.outputs.body }}
