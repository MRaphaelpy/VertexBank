spring:
  application:
    name: api-gateway

server:
  port: 8080

services:
  auth-url: ${AUTH_URL:http://localhost:8081}
  user-url: ${USER_URL:http://localhost:8082}
  account-url: ${ACCOUNT_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health, info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api-docs/auth
      - name: User Service
        url: /api-docs/users
      - name: Account Service
        url: /api-docs/accounts
